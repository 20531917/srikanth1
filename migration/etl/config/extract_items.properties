# Configuration for 01_extract_items_and_revisions

# Teamcenter connection details
# These should be for the SOURCE environment
TC_USER=infodba
TC_PASS=infodba
TC_GROUP=dba

# Query criteria for items to extract
# Use a saved query from Teamcenter
# Leave blank to extract all items of the specified types
SAVED_QUERY_NAME=__MY_MIGRATION_QUERY

# If not using a saved query, specify item types to extract
# Comma-separated list
ITEM_TYPES=MyPart,MyDrawing,MyDocument

# You can also filter by creation date (YYYY-MM-DD format)
# Leave blank to ignore
CREATED_AFTER_DATE=2020-01-01

# Output file configuration
OUTPUT_DIR=../output/extracted
ITEM_REVISION_OUTPUT_FILE=item_revisions.csv
